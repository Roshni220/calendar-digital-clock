
<!DOCTYPE html>
<html>
<head>
    <title>Calendar and Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calendar and Digital Clock</h1>

    <div class="clock">
        <h2 id="clock"></h2>
        <p id="date"></p>
    </div>

    <div class="calendar">
        <div class="header">
            <button onclick="changeMonth(-1)">❮</button>
            <h2 id="month"></h2>
            <button onclick="changeMonth(1)">❯</button>
        </div>

        <div class="days">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <div id="calendar" class="days"></div>
    </div>

    <h2 id="selectedDate">Select a date</h2>
    <button onclick="addEvent()">Add Event</button>
    <div id="events"></div>

    <script src="script.js"></script>
</body>
</html>
